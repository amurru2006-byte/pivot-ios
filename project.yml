name: Pivot
options:
  bundleIdPrefix: app.pivot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.7.5"
    CURRENT_PROJECT_VERSION: "19"
packages:
  LLM:
    url: https://github.com/eastriverlee/LLM.swift.git
    revision: 1d42188d5238ce4b9d25958f5444713b83d5e045
targets:
  Pivot:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: Pivot
      - path: Core
      - path: WorkoutLive
    dependencies:
      - package: LLM
      - target: PivotWorkoutWidget
        embed: true
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Pivot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: app.pivot.personal
        UILaunchStoryboardName: PivotLaunchV3
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCalendarsFullAccessUsageDescription: Pivot legge i calendari e modifica solo gli eventi che approvi esplicitamente.
        NSHealthShareUsageDescription: Pivot legge sonno e allenamenti per collegarli ai tuoi eventi. I dati restano sul dispositivo e sono esclusi dalle esportazioni salvo tua scelta.
        NSMicrophoneUsageDescription: Pivot usa il microfono solo quando premi Dettatura, per scrivere il messaggio che potrai controllare prima di inviare.
        NSSpeechRecognitionUsageDescription: Pivot trascrive in italiano sul dispositivo quando disponibile. L’audio non viene salvato né inviato dal Coach.
        LSSupportsOpeningDocumentsInPlace: YES
        UIFileSharingEnabled: YES
        ITSAppUsesNonExemptEncryption: NO
        NSSupportsLiveActivities: YES
        CFBundleURLTypes:
          - CFBundleURLName: app.pivot.workout
            CFBundleURLSchemes: [pivot]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pivot.personal
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Pivot/Pivot.entitlements
  PivotWorkoutWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WorkoutWidget
      - path: WorkoutLive
    info:
      path: build/Widget-Info.plist
      properties:
        CFBundleDisplayName: Allenamento Pivot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pivot.personal.workout
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: PIVOT_WIDGET
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  PivotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Pivot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pivot.interaction-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pivot:
    build:
      targets:
        Pivot: all
    test:
      targets:
        - PivotUITests
