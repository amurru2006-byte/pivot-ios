name: Pivot
options:
  bundleIdPrefix: app.pivot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "12"
packages:
  LLM:
    url: https://github.com/eastriverlee/LLM.swift.git
    revision: 1d42188d5238ce4b9d25958f5444713b83d5e045
targets:
  Pivot:
    type: application
    platform: iOS
    sources:
      - path: Pivot
      - path: Core
    dependencies:
      - package: LLM
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Pivot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: app.pivot.personal
        UILaunchStoryboardName: PivotLaunchV3
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCalendarsFullAccessUsageDescription: Pivot legge i calendari e modifica solo gli eventi che approvi esplicitamente.
        LSSupportsOpeningDocumentsInPlace: YES
        UIFileSharingEnabled: YES
        ITSAppUsesNonExemptEncryption: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pivot.personal
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PivotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Pivot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pivot.interaction-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pivot:
    build:
      targets:
        Pivot: all
    test:
      targets:
        - PivotUITests
