name: Pivot
options:
  bundleIdPrefix: app.pivot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pivot:
    type: application
    platform: iOS
    sources:
      - path: Pivot
      - path: Core
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Pivot
        CFBundleIdentifier: app.pivot.personal
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCalendarsFullAccessUsageDescription: Pivot legge i calendari e modifica solo gli eventi che approvi esplicitamente.
        LSSupportsOpeningDocumentsInPlace: YES
        UIFileSharingEnabled: YES
        ITSAppUsesNonExemptEncryption: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pivot.personal
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Pivot:
    build:
      targets:
        Pivot: all
