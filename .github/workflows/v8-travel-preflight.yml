name: Verifica editor calendario e spostamento V8
on:
  push:
    branches: ['codex/pivot-v8-085-travel']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pivot-travel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Core, gateway e strumenti senza dati personali
        run: |
          swift test
          node --test Backend/coach-gateway/worker.test.mjs
          python3 -m unittest discover -s Scripts -p 'test_*.py'
  editor:
    needs: core
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash Scripts/prepare-ios-ci.sh
      - name: Editor nativo e consenso Maps senza rete reale
        env:
          PIVOT_UI_ONLY_TESTING: v8-087-linked-travel-regression
        run: bash Scripts/preview-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pivot-editor-preflight
          path: |
            build/online-privacy-build.log
            build/online-privacy-tests.log
            build/Previews/OnlinePrivacy/
          retention-days: 2
          if-no-files-found: ignore
