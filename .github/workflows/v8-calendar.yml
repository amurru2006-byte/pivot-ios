name: Verifica calendario e AI online V8
on:
  push:
    branches: ['codex/pivot-v8-calendar', 'codex/pivot-v8-workout-audio', 'codex/pivot-v8-entrate-081', 'codex/pivot-v8-arm-081']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pivot-v8-calendar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Seleziona strumenti
        run: |
          PIVOT_XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -n 1)
          if [ -n "$PIVOT_XCODE" ]; then sudo xcode-select -s "$PIVOT_XCODE/Contents/Developer"; fi
          swift --version
      - name: Regressione Core completa
        run: |
          set -o pipefail
          mkdir -p build
          PIVOT_TEST_EXPORT_PATH=build/export-validation.xlsx swift test 2>&1 | tee build/v8-calendar-tests.log
      - name: Sicurezza e quote gateway senza rete
        run: node --test Backend/coach-gateway/worker.test.mjs
      - name: Verifica strumenti e copertura UI completa senza rete
        run: python3 -m unittest discover -s Scripts -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pivot-V8-test-core
          path: |
            build/v8-calendar-tests.log
            build/export-validation.xlsx
          retention-days: 1
          if-no-files-found: error
  ui:
    needs: core
    # Standard M1 runner, free for public repositories. Keep native simulator
    # execution independent of the Intel Core/Release packaging environment.
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [finance, workout, profile, pairing]
    steps:
      - uses: actions/checkout@v4
      - name: Prepara Xcode, progetto e unica macro approvata
        run: bash Scripts/prepare-ios-ci.sh
      - name: Regressione UI, copertura esatta senza duplicati o skip
        env:
          PIVOT_UI_ONLY_TESTING: v8-release-${{ matrix.shard }}
        run: bash Scripts/preview-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pivot-V8-test-${{ matrix.shard }}
          path: |
            build/release-${{ matrix.shard }}-build.log
            build/release-${{ matrix.shard }}-tests.log
            build/release-${{ matrix.shard }}-simulator-entitlements.plist
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pivot-V8-previews-${{ matrix.shard }}
          path: |
            build/Previews/Release-${{ matrix.shard }}/
            !build/Previews/**/*.mp4
            build/selected-simulator.json
            build/Pivot-QA-*.pdf
          retention-days: 1
          if-no-files-found: ignore
  release:
    # Every shard must succeed. No continue-on-error or partial promotion.
    needs: [core, ui]
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Pivot-V8-test-*
          path: build
          merge-multiple: true
      - name: Verifica tutti i risultati UI dello stesso run prima di compilare
        run: python3 Scripts/ui_release_shards.py --verify-all-logs build > build/ui-release-verification.json
      - name: Prepara Xcode, progetto e unica macro approvata
        run: bash Scripts/prepare-ios-ci.sh
      - name: Compila app senza firma
        run: |
          set -o pipefail
          xcodebuild -project Pivot.xcodeproj -scheme Pivot -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build/build.log
      - name: Prepara candidata V8 solo dopo tutte le verifiche
        run: bash Scripts/package-v8-candidate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pivot-V8-iPhone-candidate
          path: |
            build/Pivot-0.8.2.ipa
            build/Pivot-0.8.2-manifest.json
            build/packaged-entitlements.plist
            build/ui-release-verification.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pivot-V8-release-log
          path: |
            build/build.log
            build/ui-release-verification.json
          retention-days: 1
          if-no-files-found: ignore
