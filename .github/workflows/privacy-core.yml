name: Verifica privacy V8 senza rilascio
on:
  push:
    branches: ['codex/pivot-v8-privacy', 'codex/pivot-v8-backup', 'codex/pivot-v8-savings-core', 'codex/pivot-v8-savings-ui', 'codex/pivot-v8-history-core', 'codex/pivot-v8-history-ui', 'codex/pivot-v8-contacts-core', 'codex/pivot-v8-contacts-ui', 'codex/pivot-v8-backup-ui-fix', 'codex/pivot-v8-entrate-ui']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pivot-privacy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Core completo, inclusi confini privacy e denaro
        run: swift test
      - name: Gateway senza rete
        run: node --test Backend/coach-gateway/worker.test.mjs
      - name: Strumenti senza rete
        run: python3 -m unittest discover -s Scripts -p 'test_*.py'
  online-ui:
    needs: privacy
    if: github.ref != 'refs/heads/codex/pivot-v8-savings-core' && github.ref != 'refs/heads/codex/pivot-v8-history-core' && github.ref != 'refs/heads/codex/pivot-v8-contacts-core'
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Seleziona strumenti
        run: |
          PIVOT_XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -n 1)
          if [ -n "$PIVOT_XCODE" ]; then sudo xcode-select -s "$PIVOT_XCODE/Contents/Developer"; fi
          xcodebuild -version
      - name: Genera progetto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Autorizza solo il componente AI approvato
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          approved = json.loads(Path('Scripts/trusted-macros.json').read_text())
          assert len(approved) == 1
          assert approved[0]['targetName'] == 'LLMMacrosImplementation'
          assert approved[0]['packageIdentity'] == 'llm.swift'
          assert ('revision: ' + approved[0]['fingerprint']) in Path('project.yml').read_text()
          security = Path.home() / 'Library/org.swift.swiftpm/security'
          security.mkdir(parents=True, exist_ok=True)
          (security / 'macros.json').write_text(json.dumps(approved, indent=2))
          PY
      - name: Compila app e verifica consenso, annullamento, quote e base locale
        env:
          PIVOT_QA_BRANCH: ${{ github.ref }}
        run: |
          case "$PIVOT_QA_BRANCH" in
            refs/heads/codex/pivot-v8-backup-ui-fix) PIVOT_UI_ONLY_TESTING=PivotUITests/BackupPrivacyInteractionTests ;;
            refs/heads/codex/pivot-v8-contacts-ui|refs/heads/codex/pivot-v8-entrate-ui) PIVOT_UI_ONLY_TESTING=v8-contacts-regression ;;
            refs/heads/codex/pivot-v8-history-ui) PIVOT_UI_ONLY_TESTING=v8-history-regression ;;
            refs/heads/codex/pivot-v8-savings-ui) PIVOT_UI_ONLY_TESTING=v8-savings-regression ;;
            refs/heads/codex/pivot-v8-backup) PIVOT_UI_ONLY_TESTING=v8-privacy-regression ;;
            *) PIVOT_UI_ONLY_TESTING=PivotUITests/OnlineCoachInteractionTests ;;
          esac
          export PIVOT_UI_ONLY_TESTING
          bash Scripts/preview-ui.sh
      - name: Conserva diagnostica sintetica del collaudo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pivot-privacy-tests
          path: |
            build/online-privacy-build.log
            build/online-privacy-tests.log
            build/Previews/OnlinePrivacy/
          retention-days: 7
          if-no-files-found: ignore
