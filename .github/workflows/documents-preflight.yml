name: Lettura documenti locale e backup - solo collaudo sintetico
on:
  push:
    branches: ['codex/pivot-documents-preflight']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pivot-documents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Regressione Core completa e72 casi documenti esatti
        run: |
          set -o pipefail
          mkdir -p build
          swift test 2>&1 | tee build/document-core.log
          python3 Scripts/document_test_gates.py core build/document-core.log
      - name: Gateway e strumenti esistenti senza rete
        run: |
          node --test Backend/coach-gateway/worker.test.mjs
          python3 -m unittest discover -s Scripts -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Document-Core-synthetic
          path: build/document-core.log
          retention-days: 1
          if-no-files-found: error
  native:
    needs: core
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepara strumenti con dipendenze e macro gia fissate
        run: bash Scripts/prepare-ios-ci.sh
      - name: Ventotto prove lettura storage risposte e oggetti EventKit non salvati
        run: |
          set -o pipefail
          mkdir -p build
          xcrun simctl list devices available -j > build/document-devices.json
          PIVOT_DOCUMENT_SIMULATOR=$(python3 Scripts/select_simulator.py build/document-devices.json --metadata-out build/document-selected-simulator.json)
          xcodebuild -project Pivot.xcodeproj -scheme PivotDocumentChecks -configuration Debug \
            -destination "platform=iOS Simulator,id=$PIVOT_DOCUMENT_SIMULATOR" \
            -derivedDataPath build/DocumentsDerivedData -resultBundlePath build/DocumentTests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- test \
            2>&1 | tee build/document-native.log
          python3 Scripts/document_test_gates.py native build/document-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Document-Native-synthetic
          path: |
            build/document-native.log
            build/document-selected-simulator.json
          retention-days: 1
          if-no-files-found: error
  eventkit-roundtrip:
    needs: core
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepara progetto e host sintetico separato
        run: bash Scripts/prepare-ios-ci.sh
      - name: Crea simulatore proprio e verifica save read e cleanup EventKit
        run: python3 Scripts/calendar_roundtrip_simulator.py
      - name: Verifica entrambi i test reali e la rimozione del solo simulatore creato
        run: python3 Scripts/document_test_gates.py roundtrip build/calendar-roundtrip.log --ownership-proof build/calendar-roundtrip-owned.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Document-EventKit-roundtrip
          path: |
            build/calendar-roundtrip.log
            build/calendar-roundtrip-owned.json
            build/CalendarRoundtrip.xcresult
          retention-days: 1
          if-no-files-found: error
