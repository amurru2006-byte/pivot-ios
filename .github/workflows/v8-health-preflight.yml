name: Verifica esiti aggiornamento Salute V8
on:
  push:
    branches: ['codex/pivot-v8-health-status']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pivot-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Core, gateway e strumenti con soli dati sintetici
        run: |
          bash -n Scripts/preview-ui.sh Scripts/package-v8-candidate.sh
          swift test
          node --test Backend/coach-gateway/worker.test.mjs
          python3 -m unittest discover -s Scripts -p 'test_*.py'
  health-ui:
    needs: core
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: bash Scripts/prepare-ios-ci.sh
      - name: Due regressioni Salute senza campioni o servizi reali
        env:
          PIVOT_UI_ONLY_TESTING: v8-0810-health-regression
        run: bash Scripts/preview-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pivot-health-preflight
          path: |
            build/online-privacy-build.log
            build/online-privacy-tests.log
            build/online-privacy-simulator-entitlements.plist
            build/Previews/OnlinePrivacy/
            build/selected-simulator.json
          retention-days: 2
          if-no-files-found: ignore
