name: Verifica locale recuperi V8 senza rilascio
on:
  push:
    branches: ['codex/pivot-v8-088-core', 'codex/pivot-v8-planning-core']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pivot-088-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validazione completa senza Calendario, Maps o provider reali
        run: |
          bash -n Scripts/preview-ui.sh
          swift test
          node --test Backend/coach-gateway/worker.test.mjs
          python3 -m unittest discover -s Scripts -p 'test_*.py'
