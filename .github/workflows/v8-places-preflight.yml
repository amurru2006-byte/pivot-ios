name: Verifica luoghi e percorrenza assistita V8
on:
  push:
    branches: ['codex/pivot-v8-088-places']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pivot-places-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Core, gateway e strumenti con soli dati sintetici
        run: |
          bash -n Scripts/preview-ui.sh Scripts/package-v8-candidate.sh
          swift test
          node --test Backend/coach-gateway/worker.test.mjs
          python3 -m unittest discover -s Scripts -p 'test_*.py'
  places:
    needs: core
    # Use the standard Apple Silicon image which passed the delivered release.
    # The Intel fallback compiled but XCTest could not initialize accessibility
    # (XCTDaemonErrorDomain 18), before running even one case. No paid runner.
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: bash Scripts/prepare-ios-ci.sh
      - name: Verifica elenco luoghi e continuita del recupero senza rete reale
        env:
          PIVOT_UI_ONLY_TESTING: v8-088-places-controls-regression
        run: bash Scripts/preview-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pivot-places-preflight
          path: |
            build/online-privacy-build.log
            build/online-privacy-tests.log
            build/Previews/OnlinePrivacy/
          retention-days: 2
          if-no-files-found: ignore
