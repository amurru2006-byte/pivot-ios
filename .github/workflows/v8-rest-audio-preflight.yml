name: Verifica allarme recupero V8 senza audio reale
on:
  push:
    branches: ['codex/pivot-v8-086-rest-audio']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pivot-rest-audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Core completo, gateway e strumenti sintetici
        run: |
          swift test
          node --test Backend/coach-gateway/worker.test.mjs
          python3 -m unittest discover -s Scripts -p 'test_*.py'
  native:
    needs: core
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash Scripts/prepare-ios-ci.sh
      - name: Consenso, stop, reset e controlli senza allarmi reali
        env:
          PIVOT_UI_ONLY_TESTING: v8-086-rest-audio-regression
        run: bash Scripts/preview-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pivot-rest-audio-preflight
          path: |
            build/online-privacy-build.log
            build/online-privacy-tests.log
            build/Previews/OnlinePrivacy/
          retention-days: 3
          if-no-files-found: ignore
